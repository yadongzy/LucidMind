[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lucidmind"
version = "3.1.1"
description = "LucidMind — 清明心智，简洁透明可扩展的 AI 认知系统"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.7",
    "requests>=2.31.0",
    "PyJWT>=2.8.0",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
    "websockets>=12.0",
    "croniter>=2.0.0",
    "pydantic>=2.0.0",
    "duckduckgo-search>=6.0.0",
]

[project.optional-dependencies]
docs = ["python-pptx>=0.6.21", "openpyxl>=3.1.0", "Pillow>=10.0.0", "matplotlib>=3.8.0"]
browser = ["playwright>=1.40.0"]
telegram = ["python-telegram-bot>=21.0"]
feishu = ["lark-oapi>=1.4.0"]
all = ["lucidmind[docs,browser,telegram,feishu]"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.1.0"]

[project.scripts]
lucidmind = "cli:main"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
